<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ branding.app_name }}{% endblock %}</title>
  <meta name="color-scheme" content="dark light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ branding.logo }}">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand-block">
        <a href="/"><img class="brand-logo" src="{{ branding.logo }}" alt="{{ branding.short_name }}"></a>
        <div class="brand-text">
          <h1>{{ branding.header_title }}</h1>
          <p class="subtitle">{{ branding.tagline }}</p>
        </div>
      </div>
      <nav>
        <a href="/">All jobs</a>
        <a href="/jobs/new">+ New job</a>
        <button type="button" id="theme-btn" class="btn-theme"><span id="theme-name">—</span></button>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>{{ branding.app_name }} &middot; By <a href="{{ branding.footer_credit_url }}">{{ branding.footer_credit_name }}</a> </footer>
  </div>
  <script src="/static/js/theme.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
